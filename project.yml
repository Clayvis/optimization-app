name: PersonalOptimization

options:
  bundleIdPrefix: com.rawlins
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
  xcodeVersion: "26.4"
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    WATCHOS_DEPLOYMENT_TARGET: "11.0"
    # Centralized app-identity prefix. Override once and every target (App
    # Group, CloudKit container, keychain service id, OS Log subsystem, BG
    # task id) picks it up via BuildConfig.swift + Info.plist TeamBundlePrefix.
    TEAM_BUNDLE_PREFIX: com.rawlins.PersonalOptimization
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:

  PersonalOptimization:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PersonalOptimization
        excludes:
          - "**/.DS_Store"
    resources:
      - path: PersonalOptimization/Resources
        optional: true
      - path: PersonalOptimization/Assets.xcassets
        optional: true
      - path: PersonalOptimization/PrivacyInfo.xcprivacy
        optional: true
      # DEBUG-only Anthropic API key bootstrap. Optional: file may not exist.
      # Gitignored. See .dev-secrets/README.md.
      - path: .dev-secrets/anthropic_key.txt
        optional: true
    info:
      path: PersonalOptimization/Info.plist
      properties:
        CFBundleDisplayName: Optimization
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TeamBundlePrefix: $(TEAM_BUNDLE_PREFIX)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHealthShareUsageDescription: Tracks sleep, heart rate, and HRV to power character emotional state and weekly review insights.
        NSHealthUpdateUsageDescription: Logs workouts and water intake to Apple Health for cross-app integration.
        NSUserNotificationUsageDescription: Sends reminders for hydration, fast transitions, and scheduled blocks.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - $(TEAM_BUNDLE_PREFIX).archiveRollup
        NSUserActivityTypes:
          - $(TEAM_BUNDLE_PREFIX).activity.lift
          - $(TEAM_BUNDLE_PREFIX).activity.basketball
          - $(TEAM_BUNDLE_PREFIX).activity.swim
          - $(TEAM_BUNDLE_PREFIX).activity.custom
          - $(TEAM_BUNDLE_PREFIX).activity.learning
        UIBackgroundModes:
          - processing
          - fetch
    entitlements:
      path: PersonalOptimization/PersonalOptimization.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rawlins.PersonalOptimization
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.rawlins.PersonalOptimization
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers: []
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.rawlins.PersonalOptimization
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawlins.PersonalOptimization
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PersonalOptimizationWatch
      - target: PersonalOptimizationLiveActivity

  PersonalOptimizationWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: PersonalOptimizationWatch
        excludes:
          - "**/.DS_Store"
      - path: PersonalOptimization/Models
        name: SharedModels
      - path: PersonalOptimization/Modules/Schedule
        name: SharedSchedule
        excludes:
          - "Views/**"
          - "AI/ScheduleAIService.swift"
      - path: PersonalOptimization/Modules/Fasting
        name: SharedFasting
        excludes:
          - "Views/**"
          - "LiveActivity/**"
      - path: PersonalOptimization/Modules/Hydration
        name: SharedHydration
        excludes:
          - "Views/**"
      - path: PersonalOptimization/Modules/Training
        name: SharedTraining
        excludes:
          - "Views/**"
          - "**/Views/**"
          - "LiveActivity/**"
          - "**/LiveActivity/**"
      - path: PersonalOptimization/Modules/Learning
        name: SharedLearning
        excludes:
          - "Views/**"
          - "LearningReminderInstaller.swift"
      - path: PersonalOptimization/Modules/Character/CharacterStateService.swift
        name: SharedCharacter
      - path: PersonalOptimization/Modules/Engagement/AdaptiveNotificationTiming.swift
        name: SharedEngagement
      - path: PersonalOptimization/Modules/Engagement/SessionLifecycleService.swift
        name: SharedEngagement
      - path: PersonalOptimization/Modules/Engagement/IdentityCopy.swift
        name: SharedEngagement
      - path: PersonalOptimization/Modules/Engagement/ProtocolGoalSnapshot.swift
        name: SharedEngagement
      - path: PersonalOptimization/Services/BuildConfig.swift
      - path: PersonalOptimization/Services/Logger+Categories.swift
      - path: PersonalOptimization/Services/SwiftDataHelpers.swift
      - path: PersonalOptimization/Services/HealthKitService.swift
      - path: PersonalOptimization/Services/WatchConnectivityService.swift
      - path: PersonalOptimization/Services/AppGroupContainer.swift
      - path: PersonalOptimization/Services/AppNotifications.swift
      - path: PersonalOptimization/Services/UserCalendar.swift
      - path: PersonalOptimization/Services/DailyLogStore.swift
      - path: PersonalOptimization/Services/HandoffService.swift
      - path: PersonalOptimization/Services/PersistenceBootstrap.swift
      - path: PersonalOptimization/AppIntents
        name: SharedAppIntents
    resources:
      - path: PersonalOptimizationWatch/Assets.xcassets
        optional: true
      - path: PersonalOptimization/Resources
        name: SharedResources
    info:
      path: PersonalOptimizationWatch/Info.plist
      properties:
        CFBundleDisplayName: Optimization
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TeamBundlePrefix: $(TEAM_BUNDLE_PREFIX)
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.rawlins.PersonalOptimization
        WKBackgroundModes:
          - workout-processing
        ITSAppUsesNonExemptEncryption: false
        # Required by App Store Connect validation (error 90683). The watch
        # target links HealthKit (com.apple.developer.healthkit entitlement
        # below) and shares HealthKitService.swift, so both purpose strings
        # must ship in the watch bundle Info.plist independently of the iOS
        # parent app's strings.
        NSHealthShareUsageDescription: Tracks sleep, heart rate, and HRV to power character emotional state and weekly review insights.
        NSHealthUpdateUsageDescription: Logs workouts and water intake to Apple Health for cross-app integration.
    entitlements:
      path: PersonalOptimizationWatch/PersonalOptimizationWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rawlins.PersonalOptimization
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.rawlins.PersonalOptimization
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers: []
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.rawlins.PersonalOptimization
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawlins.PersonalOptimization.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PersonalOptimizationWatchComplications

  PersonalOptimizationLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PersonalOptimizationLiveActivity
        excludes:
          - "**/.DS_Store"
      - path: PersonalOptimization/Modules/Fasting/LiveActivity/FastingActivityAttributes.swift
      - path: PersonalOptimization/Modules/Training/LiveActivity/WorkoutActivityAttributes.swift
      - path: PersonalOptimization/Modules/Engagement/LiveActivity/DailyGoalActivityAttributes.swift
    info:
      path: PersonalOptimizationLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Live Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PersonalOptimizationLiveActivity/PersonalOptimizationLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rawlins.PersonalOptimization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawlins.PersonalOptimization.liveactivity
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundlePackageType: XPC!
        ENABLE_PREVIEWS: YES

  PersonalOptimizationWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: PersonalOptimizationWatchComplications
        excludes:
          - "**/.DS_Store"
      - path: PersonalOptimization/Models
        name: SharedModels
      - path: PersonalOptimization/Modules/Schedule
        name: SharedSchedule
        excludes:
          - "Views/**"
          - "AI/ScheduleAIService.swift"
      - path: PersonalOptimization/Modules/Fasting
        name: SharedFasting
        excludes:
          - "Views/**"
          - "LiveActivity/**"
      - path: PersonalOptimization/Modules/Hydration
        name: SharedHydration
        excludes:
          - "Views/**"
      - path: PersonalOptimization/Modules/Character/CharacterStateService.swift
        name: SharedCharacter
      - path: PersonalOptimization/Modules/Engagement/AdaptiveNotificationTiming.swift
        name: SharedEngagement
      - path: PersonalOptimization/Modules/Engagement/ProtocolGoalSnapshot.swift
        name: SharedEngagement
      - path: PersonalOptimization/Services/Logger+Categories.swift
      - path: PersonalOptimization/Services/SwiftDataHelpers.swift
      - path: PersonalOptimization/Services/ProfileService.swift
      - path: PersonalOptimization/Services/BuildConfig.swift
      - path: PersonalOptimization/Services/AppGroupContainer.swift
      - path: PersonalOptimization/Services/AppNotifications.swift
      - path: PersonalOptimization/Services/UserCalendar.swift
      - path: PersonalOptimization/Services/DailyLogStore.swift
    resources:
      - path: PersonalOptimization/Resources
        name: SharedResources
    info:
      path: PersonalOptimizationWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: Complications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PersonalOptimizationWatchComplications/PersonalOptimizationWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rawlins.PersonalOptimization
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.rawlins.PersonalOptimization
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawlins.PersonalOptimization.watchkitapp.complications
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundlePackageType: XPC!
        ENABLE_PREVIEWS: YES

  PersonalOptimizationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PersonalOptimizationTests
        excludes:
          - "**/.DS_Store"
      # Parser regression target: the reference JSON export the M5 import
      # path must round-trip exactly (sample_lab_dod.pdf arrives later).
      - path: References/sample_lab_dod.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawlins.PersonalOptimization.tests
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PersonalOptimization

schemes:

  PersonalOptimization:
    build:
      targets:
        PersonalOptimization: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - PersonalOptimization
      targets:
        - PersonalOptimizationTests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  PersonalOptimizationWatch:
    build:
      targets:
        PersonalOptimizationWatch: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
